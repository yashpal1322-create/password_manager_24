{% extends 'base.html' %}

{% block content %}

<!-- Floating Bubbles -->
<div class="bubbles">
    <span></span><span></span><span></span><span></span><span></span>
</div>

<div class="auth-container">

    <div class="auth-card">

        <!-- Header -->
        <div class="auth-header">
            <div class="auth-icon">👤</div>
            <h1 class="auth-title">Edit Username</h1>
            <p class="auth-subtitle">Update your login identifier</p>
        </div>

        <!-- Divider -->
        <div class="divider"></div>

        <!-- Form -->
        <form method="POST" action="{{ url_for('edit_password_username', id=password.id) }}">

            <div class="form-group">
                <label>Username / Email</label>

                <input 
                    type="text" 
                    name="username" 
                    class="form-control" 
                    value="{{ password.username }}" 
                    maxlength="255" 
                    required 
                    autofocus 
                >
            </div>

            <!-- Buttons -->
            <div class="btn-group">

                <a href="{{ url_for('index') }}" class="btn-secondary">
                    ← Back
                </a>

                <button type="submit" class="btn-primary">
                    💾 Save Changes
                </button>

            </div>

        </form>

    </div>

</div>

<style>

/* Layout */
.auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 95vh;
}

/* Card */
.auth-card {
    width: 100%;
    max-width: 420px;
    padding: 32px;
    border-radius: 20px;

    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(25px);

    color: white;
    position: relative;
    overflow: hidden;

    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

/* Gradient Border */
.auth-card::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 2px;
    border-radius: 20px;

    background: linear-gradient(270deg, #3b82f6, #6366f1, #3b82f6);
    background-size: 400% 400%;
    animation: borderMove 8s infinite;

    z-index: -1;
}

/* Glow */
.auth-card::after {
    content: "";
    position: absolute;
    width: 120%;
    height: 120%;
    top: -10%;
    left: -10%;
    background: radial-gradient(circle, rgba(59,130,246,0.15), transparent 60%);
    z-index: -2;
}

/* Header */
.auth-header {
    text-align: center;
    margin-bottom: 18px;
}

.auth-icon {
    font-size: 30px;
    margin-bottom: 6px;
}

.auth-title {
    font-size: 24px;
    font-weight: 600;
}

.auth-subtitle {
    font-size: 13px;
    color: #94a3b8;
}

/* Divider */
.divider {
    height: 1px;
    background: rgba(255,255,255,0.1);
    margin: 15px 0 20px;
}

/* Input */
.form-control {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    margin-top: 6px;

    background: rgba(255,255,255,0.08);
    color: white;

    transition: 0.25s;
}

.form-control:focus {
    outline: none;
    border: 1px solid #3b82f6;
    box-shadow: 0 0 12px rgba(59,130,246,0.5);
}

/* Buttons */
.btn-group {
    display: flex;
    justify-content: space-between;
    margin-top: 25px;
    gap: 10px;
}

.btn-primary {
    flex: 1;
    padding: 11px;
    border-radius: 10px;
    border: none;

    background: linear-gradient(135deg, #3b82f6, #6366f1);
    color: white;

    cursor: pointer;
    transition: 0.3s;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(59,130,246,0.4);
}

.btn-secondary {
    flex: 1;
    padding: 11px;
    border-radius: 10px;

    background: rgba(255,255,255,0.1);
    color: #cbd5f5;
    text-align: center;
    text-decoration: none;

    transition: 0.3s;
}

.btn-secondary:hover {
    background: rgba(255,255,255,0.2);
}

/* Bubbles */
.bubbles span {
    position: absolute;
    width: 20px;
    height: 20px;
    background: rgba(59,130,246,0.15);
    border-radius: 50%;
    bottom: -50px;
    animation: rise 18s infinite;
}

@keyframes rise {
    0% { transform: translateY(0); opacity: 0; }
    100% { transform: translateY(-110vh); opacity: 0; }
}

</style>

<script>

/* Parallax */
document.addEventListener("mousemove", (e) => {
    const card = document.querySelector(".auth-card");
    const x = (window.innerWidth/2 - e.clientX) / 40;
    const y = (window.innerHeight/2 - e.clientY) / 40;
    card.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
});

document.addEventListener("mouseleave", () => {
    document.querySelector(".auth-card").style.transform = "rotateY(0deg) rotateX(0deg)";
});

</script>

{% endblock %}
