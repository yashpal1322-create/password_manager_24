{% extends "base.html" %}

{% block title %}Add Password - Password Manager{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <!-- ICON -->
        <div class="auth-icon">➕</div>

        <!-- TITLE -->
        <h1 class="auth-title">Add Password</h1>

        <p class="auth-subtitle">
            Save your credentials securely in your vault
        </p>

        <!-- FORM -->
        <form method="POST" action="{{ url_for('main.add_password') }}">

            <!-- NAME -->
            <div class="form-group">
                <label>Name</label>
                <input type="text" name="name" class="form-control" placeholder="e.g. Gmail" required autofocus>
            </div>

            <!-- USERNAME -->
            <div class="form-group">
                <label>Username / Email</label>
                <input type="text" name="username" class="form-control" placeholder="Enter username" required>
            </div>

            <!-- PASSWORD -->
            <div class="form-group">
                <label>Password</label>

                <div class="password-wrapper">
                    <input type="password" id="password" name="password" class="form-control" required>

                    <button type="button" class="toggle-password"
                        onclick="togglePassword('password', this)">
                        👁️
                    </button>
                </div>

                <!-- GENERATOR -->
                <div class="generator-box">

                    <div class="generator-header">
                        🔐 Password Generator
                    </div>

                    <div class="generator-controls">

                        <input type="number" id="length" value="12" min="6" max="32">

                        <label><input type="checkbox" id="numbers" checked> 123</label>
                        <label><input type="checkbox" id="symbols" checked> @#$</label>

                        <button type="button" onclick="generatePassword()">
                            ⚡ Generate
                        </button>

                    </div>

                </div>

                <!-- STRENGTH -->
                <div id="password-strength"></div>

                <div class="strength-bar">
                    <div id="strength-fill"></div>
                </div>

            </div>

            <!-- WEBSITE -->
            <div class="form-group">
                <label>Website (Optional)</label>
                <input type="url" name="website" class="form-control" placeholder="https://example.com">
            </div>

            <!-- NOTES -->
            <div class="form-group">
                <label>Notes (Optional)</label>
                <textarea name="notes" class="form-control" placeholder="Additional info..."></textarea>
            </div>

            <!-- BUTTONS -->
            <button type="submit" class="btn-primary">
                💾 Save Password
            </button>

            <a href="{{ url_for('main.index') }}" class="btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

<!-- ================= STYLE ================= -->
<style>

body {
    background: radial-gradient(circle at top, #0f172a, #020617);
    color: white;
}

/* CENTER */
.auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 90vh;
}

/* CARD */
.auth-card {
    width: 100%;
    max-width: 420px;
    padding: 30px;
    border-radius: 18px;

    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(25px);

    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}

/* HEADER */
.auth-icon {
    text-align: center;
    font-size: 30px;
    margin-bottom: 10px;
}

.auth-title {
    text-align: center;
    font-size: 24px;
    font-weight: 600;
}

.auth-subtitle {
    text-align: center;
    font-size: 13px;
    color: #9ca3af;
    margin-bottom: 20px;
}

/* INPUT */
.form-group {
    margin-bottom: 15px;
}

.form-control {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    margin-top: 5px;

    background: rgba(255,255,255,0.08);
    color: white;
}

.form-control:focus {
    outline: none;
    box-shadow: 0 0 10px rgba(59,130,246,0.6);
}

/* PASSWORD WRAPPER */
.password-wrapper {
    position: relative;
}

.toggle-password {
    position: absolute;
    right: 10px;
    top: 8px;
    background: none;
    border: none;
    color: white;
    cursor: pointer;
}

/* GENERATOR */
.generator-box {
    margin-top: 10px;
    padding: 10px;
    border-radius: 10px;

    background: rgba(255,255,255,0.05);
}

.generator-header {
    font-size: 13px;
    margin-bottom: 8px;
}

.generator-controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.generator-controls input {
    width: 60px;
}

.generator-controls button {
    background: #6366f1;
    border: none;
    padding: 6px 10px;
    border-radius: 6px;
    color: white;
    cursor: pointer;
}

/* STRENGTH */
#password-strength {
    margin-top: 8px;
    font-size: 13px;
}

.strength-bar {
    height: 6px;
    background: #1f2937;
    border-radius: 5px;
    margin-top: 5px;
}

#strength-fill {
    height: 100%;
    width: 0%;
    border-radius: 5px;
}

/* BUTTON */
.btn-primary {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;

    background: linear-gradient(135deg, #3b82f6, #6366f1);
    color: white;

    margin-top: 10px;
    cursor: pointer;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(59,130,246,0.5);
}

.btn-secondary {
    display: block;
    text-align: center;
    margin-top: 10px;
    color: #9ca3af;
    text-decoration: none;
}

</style>

<!-- ================= JS ================= -->
<script>

const passwordInput = document.getElementById("password");
const strengthText = document.getElementById("password-strength");
const strengthFill = document.getElementById("strength-fill");

/* GENERATOR */
function generatePassword() {
    const length = document.getElementById("length").value;
    const useNumbers = document.getElementById("numbers").checked;
    const useSymbols = document.getElementById("symbols").checked;

    let chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
    if (useNumbers) chars += "0123456789";
    if (useSymbols) chars += "!@#$%^&*()_+";

    let password = "";
    for (let i = 0; i < length; i++) {
        password += chars.charAt(Math.floor(Math.random() * chars.length));
    }

    passwordInput.value = password;
    passwordInput.dispatchEvent(new Event("input"));
}

/* STRENGTH */
passwordInput.addEventListener("input", function () {

    const password = passwordInput.value;
    let score = 0;

    if (password.length >= 8) score++;
    if (/[A-Z]/.test(password)) score++;
    if (/[a-z]/.test(password)) score++;
    if (/[0-9]/.test(password)) score++;
    if (/[^A-Za-z0-9]/.test(password)) score++;

    const levels = [
        ["Weak 🔴", "#ef4444", "20%"],
        ["Fair 🟠", "#f97316", "40%"],
        ["Good 🟡", "#eab308", "60%"],
        ["Strong 🟢", "#22c55e", "80%"],
        ["Very Strong 💪", "#16a34a", "100%"]
    ];

    let [text, color, width] = levels[score - 1] || ["", "", "0%"];

    strengthText.textContent = text;
    strengthText.style.color = color;
    strengthFill.style.width = width;
    strengthFill.style.background = color;
});

/* SHOW PASSWORD */
function togglePassword(id, btn) {
    const input = document.getElementById(id);
    input.type = input.type === "password" ? "text" : "password";
}

</script>

{% endblock %}
