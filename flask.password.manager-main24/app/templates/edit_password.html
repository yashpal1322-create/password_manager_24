{% extends "base.html" %}

{% block title %}Edit Password{% endblock %}

{% block content %}

<!-- Floating Bubbles -->
<div class="bubbles">
    <span></span><span></span><span></span><span></span><span></span>
</div>

<div class="auth-container">

    <div class="auth-card">

        <!-- Header -->
        <div class="auth-header">
            <div class="auth-icon">✏️</div>
            <h1 class="auth-title">Edit Password</h1>
            <p class="auth-subtitle">Update your saved credentials</p>
        </div>

        <div class="divider"></div>

        <form method="POST"
              action="{{ url_for('main.edit_password', password_id=password.id) }}">

            <!-- BASIC INFO -->
            <div class="section">
                <h3>Basic Info</h3>

                <div class="form-group">
                    <label>Name</label>
                    <input type="text" name="name"
                           class="form-control"
                           value="{{ password.name }}" required>
                </div>

                <div class="form-group">
                    <label>Username / Email</label>
                    <input type="text" name="username"
                           class="form-control"
                           value="{{ password.username }}" required>
                </div>
            </div>

            <!-- PASSWORD -->
            <div class="section">
                <h3>Password</h3>

                <div class="form-group">
                    <label>New Password</label>

                    <div class="password-wrapper">
                        <input type="password"
                               id="new_password"
                               name="new_password"
                               class="form-control"
                               placeholder="Enter new password"
                               required>

                        <button type="button" class="toggle-password"
                                onclick="togglePassword('new_password', this)">
                            👁️
                        </button>
                    </div>

                    <small class="hint">
                        This password will be encrypted before saving
                    </small>
                </div>
            </div>

            <!-- EXTRA -->
            <div class="section">
                <h3>Additional Info</h3>

                <div class="form-group">
                    <label>Website (Optional)</label>
                    <input type="url" name="website"
                           class="form-control"
                           value="{{ password.website or '' }}">
                </div>

                <div class="form-group">
                    <label>Notes (Optional)</label>
                    <textarea name="notes"
                              class="form-control"
                              placeholder="Add notes...">{{ password.notes or '' }}</textarea>
                </div>
            </div>

            <!-- Buttons -->
            <div class="btn-group">
                <a href="{{ url_for('main.index') }}" class="btn-secondary">
                    ← Cancel
                </a>

                <button type="submit" class="btn-primary">
                    💾 Update
                </button>
            </div>

        </form>

    </div>

</div>

<style>

/* Layout */
.auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 95vh;
}

/* Card */
.auth-card {
    width: 100%;
    max-width: 520px;
    padding: 32px;
    border-radius: 20px;

    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(25px);

    color: white;
    position: relative;

    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

/* Gradient Border */
.auth-card::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 2px;
    border-radius: 20px;
    background: linear-gradient(270deg, #3b82f6, #6366f1, #3b82f6);
    background-size: 400% 400%;
    animation: borderMove 8s infinite;
    z-index: -1;
}

/* Header */
.auth-header {
    text-align: center;
    margin-bottom: 15px;
}

.auth-icon {
    font-size: 30px;
}

.auth-title {
    font-size: 24px;
    font-weight: 600;
}

.auth-subtitle {
    font-size: 13px;
    color: #94a3b8;
}

/* Divider */
.divider {
    height: 1px;
    background: rgba(255,255,255,0.1);
    margin: 15px 0 20px;
}

/* Sections */
.section {
    margin-bottom: 20px;
}

.section h3 {
    font-size: 14px;
    color: #94a3b8;
    margin-bottom: 10px;
}

/* Inputs */
.form-control {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    margin-top: 6px;

    background: rgba(255,255,255,0.08);
    color: white;
}

.form-control:focus {
    outline: none;
    border: 1px solid #3b82f6;
    box-shadow: 0 0 12px rgba(59,130,246,0.5);
}

/* Password */
.password-wrapper {
    position: relative;
}

.toggle-password {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
}

/* Hint */
.hint {
    font-size: 12px;
    color: #94a3b8;
}

/* Buttons */
.btn-group {
    display: flex;
    gap: 10px;
    margin-top: 25px;
}

.btn-primary {
    flex: 1;
    padding: 11px;
    border-radius: 10px;
    border: none;

    background: linear-gradient(135deg, #3b82f6, #6366f1);
    color: white;

    cursor: pointer;
    transition: 0.3s;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(59,130,246,0.4);
}

.btn-secondary {
    flex: 1;
    padding: 11px;
    border-radius: 10px;
    text-align: center;

    background: rgba(255,255,255,0.1);
    color: #cbd5f5;
    text-decoration: none;
}

/* Bubbles */
.bubbles span {
    position: absolute;
    width: 20px;
    height: 20px;
    background: rgba(59,130,246,0.15);
    border-radius: 50%;
    bottom: -50px;
    animation: rise 18s infinite;
}

@keyframes rise {
    0% { transform: translateY(0); opacity: 0; }
    100% { transform: translateY(-110vh); opacity: 0; }
}

@keyframes borderMove {
    0% { background-position: 0% }
    50% { background-position: 100% }
    100% { background-position: 0% }
}

</style>

{% endblock %}
