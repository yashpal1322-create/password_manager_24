{% extends "base.html" %}

{% block title %}Forgot Password{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <!-- ICON -->
        <div class="auth-icon">🔑</div>

        <!-- TITLE -->
        <h1 class="auth-title">Forgot Password</h1>

        <p class="auth-subtitle">
            Enter your registered email to receive OTP
        </p>

        <!-- FORM -->
        <form method="POST" action="{{ url_for('main.forgot_master_password') }}">

            <!-- EMAIL -->
            <div class="form-group">
                <label>Email Address</label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required
                    autofocus
                >
            </div>

            <!-- BUTTON -->
            <button type="submit" class="btn-primary">
                Send OTP
            </button>

        </form>

        <!-- LINKS -->
        <div class="auth-links">

            <a href="{{ url_for('main.login') }}">
                ← Back to Login
            </a>

        </div>

    </div>

</div>

<style>

/* SAME BACKGROUND AS LOGIN */
body {
    background: radial-gradient(circle at top, #0f172a, #020617);
}

/* CENTER */
.auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 90vh;
}

/* CARD */
.auth-card {
    width: 100%;
    max-width: 400px;
    padding: 30px;
    border-radius: 16px;

    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);

    text-align: center;
    color: #e5e7eb;

    box-shadow: 0 15px 40px rgba(0,0,0,0.5);
}

/* ICON */
.auth-icon {
    font-size: 32px;
    margin-bottom: 10px;
}

/* TITLE */
.auth-title {
    font-size: 24px;
    font-weight: 600;
}

/* SUBTITLE */
.auth-subtitle {
    font-size: 13px;
    color: #9ca3af;
    margin-bottom: 20px;
}

/* INPUT */
.form-group {
    text-align: left;
    margin-bottom: 15px;
}

.form-control {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    margin-top: 5px;

    background: rgba(255,255,255,0.08);
    color: white;
}

.form-control:focus {
    outline: none;
    box-shadow: 0 0 10px rgba(59,130,246,0.5);
}

/* BUTTON */
.btn-primary {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;

    background: linear-gradient(135deg, #3b82f6, #6366f1);
    color: white;

    cursor: pointer;
    margin-top: 10px;
}

.btn-primary:hover {
    opacity: 0.9;
}

/* LINKS */
.auth-links {
    margin-top: 15px;
}

.auth-links a {
    color: #60a5fa;
    text-decoration: none;
    font-size: 13px;
}

</style>

{% endblock %}
