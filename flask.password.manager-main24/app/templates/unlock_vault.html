{% extends 'base.html' %}

{% block content %}

<!-- Floating Bubbles -->
<div class="bubbles">
    <span></span><span></span><span></span><span></span><span></span>
</div>

<div class="auth-container">

    <div class="auth-card">

        <!-- Header -->
        <div class="auth-header">
            <div class="auth-icon">🔐</div>
            <h1 class="auth-title">Unlock Vault</h1>
            <p class="auth-subtitle">
                Enter your master password to continue
            </p>
        </div>

        <div class="divider"></div>

        <!-- Form -->
        <form method="POST" action="{{ url_for('unlock_vault') }}">

            <div class="form-group">
                <label>Master Password</label>

                <div class="password-wrapper">
                    <input 
                        type="password"
                        id="master_password"
                        name="master_password"
                        class="form-control"
                        placeholder="Enter your password"
                        required
                        autofocus
                    >

                    <button type="button"
                            class="toggle-password"
                            onclick="togglePassword('master_password', this)">
                        👁️
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-primary">
                🔓 Unlock Vault
            </button>

        </form>

        <!-- Footer -->
        <div class="auth-footer">
            <a href="{{ url_for('index') }}">
                ← Back to Dashboard
            </a>
        </div>

    </div>

</div>

<style>

/* Layout */
.auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 95vh;
}

/* Card */
.auth-card {
    width: 100%;
    max-width: 400px;
    padding: 30px;
    border-radius: 20px;

    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(25px);

    color: white;
    position: relative;

    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

/* Gradient Border */
.auth-card::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 2px;
    border-radius: 20px;

    background: linear-gradient(270deg, #3b82f6, #6366f1, #3b82f6);
    background-size: 400% 400%;
    animation: borderMove 8s infinite;

    z-index: -1;
}

/* Header */
.auth-header {
    text-align: center;
}

.auth-icon {
    font-size: 30px;
}

.auth-title {
    font-size: 22px;
    font-weight: 600;
}

.auth-subtitle {
    font-size: 13px;
    color: #94a3b8;
}

/* Divider */
.divider {
    height: 1px;
    background: rgba(255,255,255,0.1);
    margin: 15px 0 20px;
}

/* Input */
.form-control {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    margin-top: 6px;

    background: rgba(255,255,255,0.08);
    color: white;
}

.form-control:focus {
    outline: none;
    border: 1px solid #3b82f6;
    box-shadow: 0 0 12px rgba(59,130,246,0.5);
}

/* Password */
.password-wrapper {
    display: flex;
    align-items: center;
}

.toggle-password {
    margin-left: -35px;
    background: none;
    border: none;
    cursor: pointer;
}

/* Button */
.btn-primary {
    width: 100%;
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    border: none;

    background: linear-gradient(135deg, #3b82f6, #6366f1);
    color: white;

    cursor: pointer;
    transition: 0.3s;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(59,130,246,0.4);
}

/* Footer */
.auth-footer {
    text-align: center;
    margin-top: 20px;
    border-top: 1px solid rgba(255,255,255,0.1);
    padding-top: 15px;
}

.auth-footer a {
    color: #cbd5f5;
    text-decoration: none;
}

/* Bubbles */
.bubbles span {
    position: absolute;
    width: 20px;
    height: 20px;
    background: rgba(59,130,246,0.15);
    border-radius: 50%;
    bottom: -50px;
    animation: rise 18s infinite;
}

@keyframes rise {
    0% { transform: translateY(0); opacity: 0; }
    100% { transform: translateY(-110vh); opacity: 0; }
}

@keyframes borderMove {
    0% { background-position: 0% }
    50% { background-position: 100% }
    100% { background-position: 0% }
}

</style>

{% endblock %}
