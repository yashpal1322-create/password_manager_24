{% extends "base.html" %}

{% block title %}Admin Login{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <!-- ICON -->
        <div class="auth-icon">🛡️</div>

        <!-- TITLE -->
        <h1 class="auth-title">Admin Login</h1>

        <p class="auth-subtitle">
            Secure admin access to audit logs
        </p>

        <!-- FORM -->
        <form method="POST" action="{{ url_for('main.admin_login') }}">

            <!-- USERNAME -->
            <div class="form-group">
                <label>Admin Username</label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter admin username"
                    required
                    autofocus
                >
            </div>

            <!-- PASSWORD -->
            <div class="form-group">
                <label>Admin Password</label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        name="password"
                        id="password"
                        class="form-control"
                        placeholder="Enter password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('password')"
                    >
                        👁️
                    </button>

                </div>
            </div>

            <!-- LOGIN BUTTON -->
            <button type="submit" class="btn-primary">
                Login Securely
            </button>

            <!-- ADMIN SETUP BUTTON -->
            <a href="{{ url_for('main.register') }}" class="btn-secondary">
                ⚙️ Admin Setup
            </a>

        </form>

        <!-- LINKS -->
        <div class="auth-links">
            <a href="{{ url_for('main.index') }}">
                ← Back to Dashboard
            </a>
        </div>

    </div>

</div>

<!-- ================= STYLE ================= -->

<style>

/* BACKGROUND (Same as Login Page) */
body {
    background: radial-gradient(circle at top, #0f172a, #020617);
}

/* CENTER ALIGN */
.auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 92vh;
}

/* GLASS CARD */
.auth-card {
    width: 100%;
    max-width: 400px;
    padding: 32px;
    border-radius: 18px;

    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);

    text-align: center;
    color: #e5e7eb;

    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}

/* ICON */
.auth-icon {
    font-size: 34px;
    margin-bottom: 10px;
}

/* TITLE */
.auth-title {
    font-size: 26px;
    font-weight: 600;
}

/* SUBTITLE */
.auth-subtitle {
    font-size: 13px;
    color: #9ca3af;
    margin-bottom: 22px;
}

/* FORM GROUP */
.form-group {
    text-align: left;
    margin-bottom: 15px;
}

/* INPUT */
.form-control {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    margin-top: 5px;

    background: rgba(255,255,255,0.08);
    color: white;
}

.form-control:focus {
    outline: none;
    box-shadow: 0 0 12px rgba(59,130,246,0.6);
}

/* PASSWORD */
.password-wrapper {
    position: relative;
}

.toggle-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #9ca3af;
    cursor: pointer;
}

/* PRIMARY BUTTON (exact login style) */
.btn-primary {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;

    background: linear-gradient(135deg, #3b82f6, #6366f1);
    color: white;

    cursor: pointer;
    margin-top: 10px;

    transition: 0.3s;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(59,130,246,0.5);
}

/* SECOND BUTTON (outline style) */
.btn-secondary {
    display: block;
    width: 100%;
    padding: 12px;
    margin-top: 10px;

    border-radius: 10px;
    text-decoration: none;
    text-align: center;

    border: 1px solid #6366f1;
    color: #a5b4fc;

    transition: 0.3s;
}

.btn-secondary:hover {
    background: rgba(99,102,241,0.15);
    color: white;
}

/* LINKS */
.auth-links {
    margin-top: 15px;
}

.auth-links a {
    color: #60a5fa;
    text-decoration: none;
    font-size: 13px;
}

</style>

<!-- ================= JS ================= -->

<script>
function togglePassword(id) {
    const input = document.getElementById(id);
    input.type = input.type === "password" ? "text" : "password";
}
</script>

{% endblock %}
