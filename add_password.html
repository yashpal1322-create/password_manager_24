{% extends "base.html" %}

{% block title %}Add Password - Password Manager{% endblock %}

{% block content %}

<div class="card" style="max-width: 650px; margin: 20px auto;">

    <div class="auth-header">

        <div class="auth-icon">➕</div>

        <h1 class="auth-title">Add Password</h1>

        <p class="auth-subtitle">
            Save a new password securely in your vault.
        </p>

    </div>

    <form method="POST" action="{{ url_for('main.add_password') }}">

        <!-- Name -->
        <div class="form-group">
            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                name="name"
                class="form-control"
                placeholder="e.g. Gmail, Facebook, Bank"
                required
                autofocus
            >
        </div>

        <!-- Username -->
        <div class="form-group">
            <label for="username">Username / Email</label>
            <input
                type="text"
                id="username"
                name="username"
                class="form-control"
                placeholder="Enter username or email"
                required
            >
        </div>

        <!-- Password -->
        <div class="form-group">
            <label for="password">Password</label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter password"
                    autocomplete="new-password"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword('password', this)"
                >
                    👁️
                </button>
            </div>

            <!-- Strength Text -->
            <div id="password-strength" style="margin-top:8px; font-size:13px;"></div>

            <!-- Strength Bar -->
            <div style="height:6px; border-radius:5px; background:#e5e7eb; margin-top:5px;">
                <div id="strength-fill" style="
                    height:100%;
                    width:0%;
                    border-radius:5px;
                    transition:0.3s;
                "></div>
            </div>

        </div>

        <!-- Website -->
        <div class="form-group">
            <label for="website">
                Website
                <span style="color:#9ca3af;">(Optional)</span>
            </label>
            <input
                type="url"
                id="website"
                name="website"
                class="form-control"
                placeholder="https://example.com"
            >
        </div>

        <!-- Notes -->
        <div class="form-group">
            <label for="notes">
                Notes
                <span style="color:#9ca3af;">(Optional)</span>
            </label>
            <textarea
                id="notes"
                name="notes"
                class="form-control"
                placeholder="Add any additional notes..."
            ></textarea>
        </div>

        <!-- Security Notice -->
        <div style="
            background:#eff6ff;
            border:1px solid #bfdbfe;
            color:#1e40af;
            padding:12px;
            border-radius:7px;
            margin-bottom:20px;
            font-size:13px;
        ">
            🔒 Your password will be encrypted before being stored.
        </div>

        <!-- Buttons -->
        <div class="actions">
            <button type="submit" class="btn btn-success">
                💾 Save Password
            </button>

            <a href="{{ url_for('main.index') }}" class="btn btn-secondary">
                ← Cancel
            </a>
        </div>

    </form>
</div>

<!-- ========================= -->
<!-- PASSWORD STRENGTH SCRIPT -->
<!-- ========================= -->

<script>
const passwordInput = document.getElementById("password");
const strengthText = document.getElementById("password-strength");
const strengthFill = document.getElementById("strength-fill");

passwordInput.addEventListener("input", function () {

    const password = passwordInput.value;
    let score = 0;

    if (password.length >= 8) score++;
    if (/[A-Z]/.test(password)) score++;
    if (/[a-z]/.test(password)) score++;
    if (/[0-9]/.test(password)) score++;
    if (/[^A-Za-z0-9]/.test(password)) score++;

    let text = "";
    let color = "";
    let width = "";

    switch (score) {
        case 0:
        case 1:
            text = "Weak 🔴";
            color = "#ef4444";
            width = "20%";
            break;

        case 2:
            text = "Fair 🟠";
            color = "#f97316";
            width = "40%";
            break;

        case 3:
            text = "Good 🟡";
            color = "#eab308";
            width = "60%";
            break;

        case 4:
            text = "Strong 🟢";
            color = "#22c55e";
            width = "80%";
            break;

        case 5:
            text = "Very Strong 💪";
            color = "#16a34a";
            width = "100%";
            break;
    }

    strengthText.textContent = text;
    strengthText.style.color = color;

    strengthFill.style.width = width;
    strengthFill.style.background = color;
});


// جلوگیری weak password submit
document.querySelector("form").addEventListener("submit", function (e) {

    const password = passwordInput.value;

    if (password.length < 8) {
        e.preventDefault();
        alert("Password must be at least 8 characters.");
    }

});
</script>

{% endblock %}
