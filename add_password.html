{% extends "base.html" %}

{% block title %}Add Password - Password Manager{% endblock %}

{% block content %}

<div class="card" style="max-width: 650px; margin: 20px auto;">

    <div class="auth-header">
        <div class="auth-icon">➕</div>
        <h1 class="auth-title">Add Password</h1>
        <p class="auth-subtitle">
            Save a new password securely in your vault.
        </p>
    </div>

    <form method="POST" action="{{ url_for('main.add_password') }}">

        <!-- Name -->
        <div class="form-group">
            <label>Name</label>
            <input type="text" name="name" class="form-control" required autofocus>
        </div>

        <!-- Username -->
        <div class="form-group">
            <label>Username / Email</label>
            <input type="text" name="username" class="form-control" required>
        </div>

        <!-- Password -->
        <div class="form-group">
            <label>Password</label>

            <div class="password-wrapper">
                <input type="password" id="password" name="password"
                       class="form-control" required>

                <button type="button" class="toggle-password"
                        onclick="togglePassword('password', this)">
                    👁️
                </button>
            </div>

            <!-- 🔐 GENERATOR OPTIONS -->
            <div style="margin-top:10px; padding:10px; background:#f9fafb; border-radius:6px;">

                <label style="font-size:13px;">Password Generator (Optional)</label>

                <div style="display:flex; gap:10px; margin-top:5px; flex-wrap:wrap;">

                    <input type="number" id="length" value="12" min="6" max="32"
                           style="width:70px;" class="form-control">

                    <label style="font-size:13px;">
                        <input type="checkbox" id="numbers" checked> 123
                    </label>

                    <label style="font-size:13px;">
                        <input type="checkbox" id="symbols" checked> @#$
                    </label>

                    <button type="button" class="btn btn-secondary btn-sm"
                            onclick="generatePassword()">
                        ⚡ Generate
                    </button>

                </div>
            </div>

            <!-- Strength -->
            <div id="password-strength" style="margin-top:8px; font-size:13px;"></div>

            <div style="height:6px; background:#e5e7eb; margin-top:5px;">
                <div id="strength-fill" style="height:100%; width:0%;"></div>
            </div>

        </div>

        <!-- Website -->
        <div class="form-group">
            <label>Website (Optional)</label>
            <input type="url" name="website" class="form-control">
        </div>

        <!-- Notes -->
        <div class="form-group">
            <label>Notes (Optional)</label>
            <textarea name="notes" class="form-control"></textarea>
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-success">💾 Save</button>
            <a href="{{ url_for('main.index') }}" class="btn btn-secondary">Cancel</a>
        </div>

    </form>
</div>

<!-- ================= JS ================= -->

<script>
const passwordInput = document.getElementById("password");
const strengthText = document.getElementById("password-strength");
const strengthFill = document.getElementById("strength-fill");

/* 🔐 PASSWORD GENERATOR */
function generatePassword() {
    const length = document.getElementById("length").value;
    const useNumbers = document.getElementById("numbers").checked;
    const useSymbols = document.getElementById("symbols").checked;

    let chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
    if (useNumbers) chars += "0123456789";
    if (useSymbols) chars += "!@#$%^&*()_+";

    let password = "";
    for (let i = 0; i < length; i++) {
        password += chars.charAt(Math.floor(Math.random() * chars.length));
    }

    passwordInput.value = password;
    passwordInput.dispatchEvent(new Event("input")); // trigger strength
}

/* 🔐 STRENGTH CHECKER */
passwordInput.addEventListener("input", function () {
    const password = passwordInput.value;
    let score = 0;

    if (password.length >= 8) score++;
    if (/[A-Z]/.test(password)) score++;
    if (/[a-z]/.test(password)) score++;
    if (/[0-9]/.test(password)) score++;
    if (/[^A-Za-z0-9]/.test(password)) score++;

    let text="", color="", width="";

    switch(score){
        case 0:
        case 1: text="Weak 🔴"; color="#ef4444"; width="20%"; break;
        case 2: text="Fair 🟠"; color="#f97316"; width="40%"; break;
        case 3: text="Good 🟡"; color="#eab308"; width="60%"; break;
        case 4: text="Strong 🟢"; color="#22c55e"; width="80%"; break;
        case 5: text="Very Strong 💪"; color="#16a34a"; width="100%"; break;
    }

    strengthText.textContent = text;
    strengthText.style.color = color;
    strengthFill.style.width = width;
    strengthFill.style.background = color;
});

/* 🚫 BLOCK WEAK PASSWORD */
document.querySelector("form").addEventListener("submit", function (e) {
    if (passwordInput.value.length < 8) {
        e.preventDefault();
        alert("Password must be at least 8 characters.");
    }
});
</script>

{% endblock %}
