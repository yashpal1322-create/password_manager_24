{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-dark text-white">

                    <h4 class="mb-0">
                        ✏️ Edit Password Name
                    </h4>

                </div>


                <div class="card-body">

                    <form
                        method="POST"
                        action="{{ url_for('edit_password_name', id=password.id) }}"
                    >
                    

                        <!-- Current Name -->

                        <div class="mb-3">

                            <label
                                for="name"
                                class="form-label"
                            >
                                Password Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="name"
                                name="name"
                                value="{{ password.name }}"
                                maxlength="255"
                                required
                                autofocus
                            >

                        </div>


                        <!-- Buttons -->

                        <div class="mt-4">

                            <a
                                href="{{ url_for('index') }}"
                                class="btn btn-secondary"
                            >
                                ← Back
                            </a>


                            <button
                                type="submit"
                                class="btn btn-dark"
                            >
                                💾 Save
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
