{% extends "base.html" %}

{% block title %}Edit Password - Password Manager{% endblock %}

{% block content %}

<div class="card" style="max-width: 650px; margin: 20px auto;">

    <div class="auth-header">

        <div class="auth-icon">
            ✏️
        </div>

        <h1 class="auth-title">
            Edit Password
        </h1>

        <p class="auth-subtitle">
            Update your saved login credentials.
        </p>

    </div>


    <form
        method="POST"
        action="{{ url_for(
            'main.edit_password',
            password_id=password.id
        ) }}"
    >

        <!-- Name -->

        <div class="form-group">

            <label for="name">
                Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                class="form-control"
                value="{{ password.name }}"
                required
            >

        </div>


        <!-- Username -->

        <div class="form-group">

            <label for="username">
                Username / Email
            </label>

            <input
                type="text"
                id="username"
                name="username"
                class="form-control"
                value="{{ password.username }}"
                required
            >

        </div>


        <!-- New Password -->

        <div class="form-group">

            <label for="new_password">
                Password
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    class="form-control"
                    placeholder="Enter new password"
                    autocomplete="new-password"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    onclick="
                        togglePassword(
                            'new_password',
                            this
                        )
                    "
                >
                    👁️
                </button>

            </div>

            <small
                style="
                    display: block;
                    margin-top: 6px;
                    color: #6b7280;
                "
            >
                Enter the password you want to save.
            </small>

        </div>


        <!-- Website -->

        <div class="form-group">

            <label for="website">
                Website
                <span
                    style="
                        color: #9ca3af;
                        font-weight: normal;
                    "
                >
                    (Optional)
                </span>
            </label>

            <input
                type="url"
                id="website"
                name="website"
                class="form-control"
                value="{{ password.website or '' }}"
                placeholder="https://example.com"
            >

        </div>


        <!-- Notes -->

        <div class="form-group">

            <label for="notes">
                Notes
                <span
                    style="
                        color: #9ca3af;
                        font-weight: normal;
                    "
                >
                    (Optional)
                </span>
            </label>

            <textarea
                id="notes"
                name="notes"
                class="form-control"
                placeholder="Add notes..."
            >{{ password.notes or '' }}</textarea>

        </div>


        <!-- Security Notice -->

        <div
            style="
                background: #eff6ff;
                border: 1px solid #bfdbfe;
                color: #1e40af;
                padding: 12px;
                border-radius: 7px;
                margin-bottom: 20px;
                font-size: 13px;
            "
        >

            🔒 The new password will be encrypted before
            being stored.

        </div>


        <!-- Buttons -->

        <div class="actions">

            <button
                type="submit"
                class="btn btn-success"
            >
                💾 Update Password
            </button>

            <a
                href="{{ url_for('main.index') }}"
                class="btn btn-secondary"
            >
                ← Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
