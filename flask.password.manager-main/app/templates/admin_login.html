{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-header bg-dark text-white text-center">

                    <h3>🛡️ Admin Login</h3>

                </div>


                <div class="card-body">

                    <p class="text-center text-muted">
                        Admin account se login karke audit logs
                        access karein.
                    </p>


                    <form
                        method="POST"
                        action="{{ url_for('admin_login') }}"
                    >

                        <!-- ================================================= -->
                        <!-- ADMIN USERNAME -->
                        <!-- ================================================= -->

                        <div class="mb-3">

                            <label
                                for="username"
                                class="form-label"
                            >
                                Admin Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                id="username"
                                class="form-control"
                                autocomplete="username"
                                maxlength="255"
                                required
                                autofocus
                            >

                        </div>


                        <!-- ================================================= -->
                        <!-- ADMIN PASSWORD -->
                        <!-- ================================================= -->

                        <div class="mb-3">

                            <label
                                for="password"
                                class="form-label"
                            >
                                Admin Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                id="password"
                                class="form-control"
                                autocomplete="current-password"
                                required
                            >


                            <!-- Show Password -->

                            <div class="form-check mt-2">

                                <input
                                    type="checkbox"
                                    class="form-check-input"
                                    id="showPassword"
                                >

                                <label
                                    class="form-check-label"
                                    for="showPassword"
                                >
                                    Show Password
                                </label>

                            </div>

                        </div>


                        <!-- ================================================= -->
                        <!-- LOGIN BUTTON -->
                        <!-- ================================================= -->

                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-dark"
                            >
                                🛡️ Admin Login
                            </button>

                        </div>

                    </form>

                </div>


                <!-- ================================================= -->
                <!-- BACK -->
                <!-- ================================================= -->

                <div class="card-footer text-center">

                    <a
                        href="{{ url_for('index') }}"
                        class="btn btn-secondary"
                    >
                        ← Back
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- ===================================================== -->
<!-- SHOW / HIDE ADMIN PASSWORD -->
<!-- ===================================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const passwordInput =
            document.getElementById(
                "password"
            );


        const showPassword =
            document.getElementById(
                "showPassword"
            );


        showPassword.addEventListener(
            "change",
            function () {

                passwordInput.type =
                    this.checked
                        ? "text"
                        : "password";

            }
        );

    }
);

</script>

{% endblock %}
