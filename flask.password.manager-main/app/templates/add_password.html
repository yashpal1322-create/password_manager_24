{% extends "base.html" %}

{% block title %}Add Password - Password Manager{% endblock %}

{% block content %}

<div class="card" style="max-width: 650px; margin: 20px auto;">

    <div class="auth-header">

        <div class="auth-icon">
            ➕
        </div>

        <h1 class="auth-title">
            Add Password
        </h1>

        <p class="auth-subtitle">
            Save a new password securely in your vault.
        </p>

    </div>


    <form
        method="POST"
        action="{{ url_for('main.add_password') }}"
    >

        <!-- Name -->

        <div class="form-group">

            <label for="name">
                Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                class="form-control"
                placeholder="e.g. Gmail, Facebook, Bank"
                required
                autofocus
            >

        </div>


        <!-- Username -->

        <div class="form-group">

            <label for="username">
                Username / Email
            </label>

            <input
                type="text"
                id="username"
                name="username"
                class="form-control"
                placeholder="Enter username or email"
                required
            >

        </div>


        <!-- Password -->

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter password"
                    autocomplete="new-password"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    onclick="
                        togglePassword(
                            'password',
                            this
                        )
                    "
                    aria-label="Show or hide password"
                >
                    👁️
                </button>

            </div>

        </div>


        <!-- Website -->

        <div class="form-group">

            <label for="website">
                Website
                <span
                    style="
                        color: #9ca3af;
                        font-weight: normal;
                    "
                >
                    (Optional)
                </span>
            </label>

            <input
                type="url"
                id="website"
                name="website"
                class="form-control"
                placeholder="https://example.com"
            >

        </div>


        <!-- Notes -->

        <div class="form-group">

            <label for="notes">
                Notes
                <span
                    style="
                        color: #9ca3af;
                        font-weight: normal;
                    "
                >
                    (Optional)
                </span>
            </label>

            <textarea
                id="notes"
                name="notes"
                class="form-control"
                placeholder="Add any additional notes..."
            ></textarea>

        </div>


        <!-- Security Notice -->

        <div
            style="
                background: #eff6ff;
                border: 1px solid #bfdbfe;
                color: #1e40af;
                padding: 12px;
                border-radius: 7px;
                margin-bottom: 20px;
                font-size: 13px;
            "
        >

            🔒 Your password will be encrypted before being
            stored in the database.

        </div>


        <!-- Buttons -->

        <div class="actions">

            <button
                type="submit"
                class="btn btn-success"
            >
                💾 Save Password
            </button>

            <a
                href="{{ url_for('main.index') }}"
                class="btn btn-secondary"
            >
                ← Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
